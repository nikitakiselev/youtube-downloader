name: Download video

# Скачивает видео с оригинальной озвучкой и русскими субтитрами.
# Готовый файл — в разделе Artifacts на странице запуска.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Ссылка на видео YouTube
        required: true
      soft:
        description: Субтитры отдельной дорожкой (.mkv) вместо вшитых (.mp4)
        type: boolean
        default: false
      quality:
        description: Максимальная высота кадра
        default: "1080"
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/download.yml", "download.sh"]

env:
  URL: ${{ inputs.url || 'https://youtu.be/M6OAZGwPqHM' }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      # Генерирует PO-токены, без которых YouTube не отдаёт форматы выше 360p.
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
      - name: Download
        env:
          YTDLP_ARGS: --extractor-args youtube:player_client=mweb,default --retries 10 --extractor-retries 5 --sleep-subtitles 5
          X264_PRESET: veryfast
        run: ./download.sh ${{ inputs.soft && '--soft' || '' }} -q "${{ inputs.quality || '1080' }}" -o out "$URL"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          compression-level: 0
          retention-days: 7
